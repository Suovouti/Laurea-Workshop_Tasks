<!DOCTYPE html>
    <html lang="en">
    <head>
        <style>
    h1 {
        color: rgb(1, 79, 131);
    }
    p {
        color: rgb(10, 10, 61);
    }

    body {
        background-color: lightgray;
          max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }

    .word-of-the-day-box {
        padding: 15px;
        margin: 5px;
        background-color: #f0f0f0;
        border: 1px solid #ccc;
    }

    h1 {
        font-size: 2em;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    
    th {
      background-color: #f2f2f2;
    }
    
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    label {
      font-weight: bold;
    }
    
    input[type="text"], input[type="email"] {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    input[type="submit"] {
      background-color: #146418;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    input[type="submit"]:hover {
      background-color: #146418;
    }
    </style>
